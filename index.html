<!-- 
Canzoniere Smart è un catalogo in evoluzione ma già contenente più di 500 
"spartiti" per chitarra delle canzoni preferite di Emanuele Carpanzano
le funzioni smart in JavaScript permettono trasposizioni di tono e/o
modifiche di notatione Italiana o Internazionale
-->

<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canzoniere Smart</title>
    <link rel="stylesheet" href="CanzoniereSmart.css">
</head>
<body>

    <!-- ================= 1. SCHERMATA SPLASH (HOME) ================= -->
    <div id="splash-screen" class="splash-container">
        <img src="Canzoniere.png" alt="Copertina Canzoniere" class="splash-img">
        <span>😊</span> <h1 style="display: inline;">Ciaooooo!</h1> <span>😊</span>
        <img src="pianista.gif" alt="Pianista" />
        <h2>Clicca sul catalogo (🎸 o ⛪) </h2>
        <div class="splash-buttons">
            <button id="btn-load-pop" class="btn-choice">🎸 Canzoniere Pop / Rock <img src="chitarrista.gif" alt="chitarrista" /></button>
            <button id="btn-load-chiesa" class="btn-choice">⛪ Canzoniere Liturgico <img src="eucaristia.gif" alt="eucaristia" /></button>
        </div>

        <!-- === NUOVA SEZIONE: SELEZIONE RAPIDA SCALETTE LITURGICHE === -->
        <div class="splash-scalette-zone" style="margin-top: 30px; border-top: 2px dashed #ccc; padding-top: 20px;">
            <h3>📋 Avvia una Scaletta Liturgica Pronta:</h3>
            <button id="btn-load-scaletta-domenica" class="btn-choice" style="background-color: #8e44ad; color: white;">
                ⛪ Messa: Domenica Tempo Ordinario
            </button>
        </div>
    </div>
    
    <!-- ================= 2. SCHERMATA DI RICERCA ================= -->
    <div id="menu-screen" class="menu-container" style="display: none;">
        <button id="btn-home-splash" class="btn-back-splash">Torna a 🏠 per la SCELTA</button>
        <h1 id="menu-main-title">Canzoniere Smart</h1>
        <h2>di Emanuele Carpanzano</h2>
        
        <div class="menu-group search-box-container">
            <label for="search-input">🔍 Cerca Canzone o Autore:</label>
            <input type="text" id="search-input" placeholder="Digita il titolo o l'autore...">
            <div id="search-results" class="search-results-list" style="display:none;"></div>
        </div>
    </div>

   <!-- ================= 3. SCHERMATA VISUALIZZAZIONE SPARTITO ================= -->
    <div id="song-screen" style="display: none;">
        <!-- NUOVA BARRA DI CONTROLLO SUPERIORE PER I TOGGLE DI VISUALIZZAZIONE -->
        <div class="top-toggle-bar">
            <button id="btn-toggle-controls" class="btn-toggle-panel" title="Mostra/Nascondi Controlli e Tonalità">⚙️ Pannello Controlli</button>
            <button id="btn-toggle-scaletta" class="btn-toggle-panel" title="Mostra/Nascondi la Scaletta del Giorno" style="display: none;">📋 Pannello Scaletta</button>
        </div>
        
        <!-- IL TUO VECCHIO CONTENITORE CONTROLLI (SINISTRA) -->
        <div id="controls-panel" class="controls">
            <button id="btn-elenco-brani" class="btn-menu">⬅ Elenco Brani</button>
            <hr>
            <button id="btn-transpose-meno">-1 Semitono</button>
            <button id="btn-transpose-piu">+1 Semitono</button>
            <br><br>
            <label><input type="radio" name="notation" id="radio-it" value="IT" checked> ITA</label>
            <label><input type="radio" name="notation" id="radio-en" value="EN"> ENG</label>
            <div id="info-tonalita">Tonalità: Originale</div>
            
            <button id="btn-wcag-toggle" class="btn-player" title="Compatta spartito a max 80 caratteri (Standard WCAG)">
              ↔️ Compatta WCAG
            </button>   
            
            <div id="scroll-panel">
                <hr>
                <button id="btn-scroll">▶ Auto-Scroll</button>
                <div class="scroll-speed-controls">
                    <button id="btn-scroll-slower">Slower</button>
                    <button id="btn-scroll-faster">Faster</button>
                </div>
                <div id="info-velocita">Velocità: 1x</div>
            </div>
        </div>

        <!-- CONTENITORE PRINCIPALE DELLO SPARTITO (CENTRO) -->
        <div class="song-main-area">
            <div id="offline-zone" class="offline-picker">
                <strong>Modalità Offline locale:</strong><br>
                Seleziona il file <span id="target-filename" style="color:#d32f2f; font-weight:bold;"></span> dentro la cartella configurata:<br><br>
                <input type="file" id="file-selector" accept=".txt">
            </div>

            <h2 id="song-title-container">
                <span id="song-title"></span>
                <span id="song-author"></span>
            </h2>

            <pre id="song-content">Caricamento in corso...</pre>
        </div>

        <!-- SIDEBAR DELLA SCALETTA (DESTRA) -->
        <div id="scaletta-panel" class="scaletta-sidebar" style="display: none;">
            <h3>📋 Scaletta Attiva</h3>
            <h4 id="scaletta-nome-titolo">Nessuna scaletta</h4>
            <div id="scaletta-bottoni-container" class="scaletta-list"></div>
        </div>

    </div>

    <!-- Caricamento degli Script Modulari -->
    <script src="transposer.js"></script>
    <script src="CanzoniereSmart.js"></script>
</body>
</html>
